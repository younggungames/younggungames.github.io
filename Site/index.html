<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Younggun Games</title>
<style>
:root { --bg: #f6e7cf; --card: #fffaf0; --ink: #4a2a14; --sub: #7a5a3c; --line: #e3cba6; --accent: #e9634f; --wood: #c98a55; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.7 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", "Segoe UI", sans-serif; }
main { max-width: 760px; margin: 0 auto; padding: 24px 16px 48px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 24px 20px; box-shadow: 0 4px 0 var(--line); }
h1 { font-size: 1.6rem; line-height: 1.3; margin: 0 0 8px; }
h2 { font-size: 1.2rem; margin: 28px 0 8px; padding-top: 12px; border-top: 1px dashed var(--line); }
h3 { font-size: 1.05rem; margin: 20px 0 6px; }
a { color: var(--accent); }
code { background: #f1e2c8; border-radius: 6px; padding: 1px 6px; font-size: .92em; word-break: break-all; }
ul { padding-left: 1.2em; }
li { margin: 4px 0; }
.table { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: .95rem; }
th, td { border: 1px solid var(--line); padding: 8px; text-align: left; vertical-align: top; }
th { background: #f3e1c4; }
.lang { text-align: right; margin: 0 0 12px; font-size: .95rem; }
.meta { color: var(--sub); font-size: .95rem; }
footer { text-align: center; color: var(--sub); font-size: .85rem; margin-top: 28px; }
</style>
</head>

<main>
<div class="card" style="text-align:center">

</html>
